name: Vidéo TikTok du jour

# Lancé chaque matin à 9 h par le réveil GitHub ci-dessous (dépôt public,
# depuis le 27/11/2026), ou à la main (bouton « Run workflow »).
# Fabrique la vidéo « avec images » (3 vraies offres du pays du jour, niveaux
# mélangés, une image par métier ; MODELE=styles pour les 4 anciens styles),
# puis l'envoie en BROUILLON dans l'appli TikTok du compte branché.
# Elle part aussi en Short YouTube et en Reel Facebook + Instagram.
on:
  schedule:
    # Chaque matin vers 9 h (heure de Bamako = UTC). Dépôt public : minutes illimitées.
    - cron: '7 9 * * *'
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai : fabriquer la vidéo sans l'envoyer à TikTok (elle est gardée ici, dans « Artifacts »)"
        type: boolean
        default: false
      pays:
        description: "Facultatif : code du pays (ML, CI, SN, BF, GN, NE, TG, BJ). Vide = pays du jour."
        required: false
      statut:
        description: "Facultatif : seulement vérifier une vidéo déjà envoyée (son publish_id)."
        required: false

permissions:
  contents: read

concurrency:
  group: tiktok
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      # Voix off : Kokoro, voix féminine française « ff_siwis » (gratuite, sans compte).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: video/requirements.txt
      - run: pip install -q -r requirements.txt
      - name: Modèle de la voix (gardé en cache)
        id: voix
        uses: actions/cache@v4
        with:
          path: video/voix
          key: kokoro-v1.0
      - if: steps.voix.outputs.cache-hit != 'true'
        run: |
          mkdir -p voix
          curl -sSfL -o voix/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSfL -o voix/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Fabriquer (et envoyer) la vidéo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PAYS: ${{ inputs.pays }}
          VOIX: ${{ github.workspace }}/video/voix
          STATUT: ${{ inputs.statut }}
          ESSAI: ${{ inputs.essai }}
        # Vidéo spéciale déjà montée pour aujourd'hui (films/jour-AAAA-MM-JJ/ avec
        # video.mp4 + envoi.json) : elle remplace la vidéo automatique du jour.
        run: |
          JOUR="../films/jour-$(date -u +%F)"
          if [ -n "$STATUT" ]; then node src/video.mjs --statut "$STATUT"
          elif [ -f "$JOUR/video.mp4" ] && [ "$ESSAI" != "true" ]; then echo "Vidéo spéciale du jour : $JOUR"; node src/envoi-special.mjs "$JOUR"
          else node src/video.mjs ${{ inputs.essai && '--essai' || '' }}; fi
      - name: Garder la vidéo 7 jours
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-tiktok
          path: |
            video/sortie/*.mp4
            video/sortie/legende.txt
          retention-days: 7
          if-no-files-found: ignore
