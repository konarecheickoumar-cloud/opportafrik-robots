name: Vidéo avec images (essai, données)

# Essai : récupère les vraies offres du jour + logos + images d'illustration
# et les range dans essai-images/ sur la branche d'essai (pas d'envoi).
on:
  push:
    branches: [claude/project-thread-tjzvvq]
    paths: [essai-images/lancer.txt]

permissions:
  contents: write

jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Offres, logos et images
        working-directory: video
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PAYS: ML
        run: node src/images-donnees.mjs ../essai-images/donnees
      - name: Ranger sur la branche
        run: |
          git config user.name "opportafrik-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add essai-images/donnees
          git commit -m "Essai vidéo avec images : données du jour" || exit 0
          git push
